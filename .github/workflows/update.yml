name: 每日更新熱度資料

on:
  schedule:
    # 台北時間每天 22:30(UTC 14:30),收盤後、晚間討論高峰後執行
    - cron: "30 14 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取資料並產出報表
        run: python3 src/main.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/heat.json docs/data.js
          if git diff --cached --quiet; then
            echo "資料無變化,略過提交"
          else
            git commit -m "chore: 更新熱度資料 $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M')"
            git push
          fi
