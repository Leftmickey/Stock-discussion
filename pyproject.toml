[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stockheat"
version = "0.1.0"
description = "台股標的名稱／代號查詢與網路討論熱度、情緒追蹤器"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pyahocorasick>=2.1",
    "pandas>=2.2",
    "PyYAML>=6.0",
    "streamlit>=1.36",
    "plotly>=5.22",
]

[project.optional-dependencies]
trends = ["trendspyg>=1.1"]
dev = ["pytest>=8.2", "ruff>=0.5"]

[project.scripts]
stockheat = "stockheat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stockheat = ["resources/*.yaml", "storage/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
