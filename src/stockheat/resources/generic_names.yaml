# 與日常用語重疊的股票簡稱。
#
# 這些名稱單獨出現在文章裡幾乎都不是在講股票，因此比對層會把它們升到最嚴格的
# 層級：必須同篇出現該股代號，或命中由公司全名衍生的長別名（例如「世界」要看到
# 「世界先進」）才採計。
#
# 為什麼需要人工清單：辨別「數字」是常用詞、「鴻海」是公司名，靠的是詞彙知識，
# 不是字串規則能推導的。而且連「鄰近有金融語境」都擋不住——「營收數字」會命中
# 5287 數字，它旁邊就是「營收」。
#
# 清單不必求全。儀表板的稽核頁可以標記誤判並一鍵加入，使用者自己補的詞會寫到
# data/generic_names_user.yaml，不會被套件更新覆蓋。

