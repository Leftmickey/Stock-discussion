# 台股語境詞典
#
# 情緒判讀不使用預訓練模型。開源的繁中金融情緒分類器並不存在（FinBERT2 是簡體
# 語料的預訓練骨幹，需自行微調），而通用中文情感模型對股板用語一律判錯：
# 「軋空」是大利多、「畢業」是慘賠出場、「住套房」與房地產無關。
# 自建詞典搭配 PTT 推噓比更準且零成本。

# 金融語境詞：判斷一個模糊命中附近是不是真的在談股票。
# 只爬 Stock 板，所以「這篇跟股票有關」是既定前提，語境判斷必須看命中位置附近。
context_tokens:
  - 股
  - 股價
  - 股票
  - 漲
  - 跌
  - 漲停
  - 跌停
  - 買
