# 否定詞：出現在情緒詞前方數字元內就反轉極性（「不看好」「沒起飛」）。
negations:
  - 不
  - 沒
  - 別
  - 難
  - 未
  - 無
  - 非
  - 勿

# PTT 標題分類標籤。[標的] 一定是在談特定個股，是最強的匹配訊號。
title_tags:
  strong: ["標的"]
  normal: ["新聞", "情報", "請益", "心得", "討論", "問題", "研究", "公告"]
  weak: ["閒聊", "心情", "創作", "活動", "其他"]
